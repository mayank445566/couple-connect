# /etc/turnserver.conf for coturn (apt install coturn; set TURNSERVER_ENABLED=1 in /etc/default/coturn)
# Time-limited credentials: the API signs them with the same secret (TURN_SECRET in backend/.env).

listening-port=3478
tls-listening-port=5349
# Public IP of the VPS (and private IP if behind NAT, e.g. external-ip=203.0.113.10/10.0.0.5)
external-ip=YOUR_VPS_PUBLIC_IP
realm=turn.yourdomain.com
server-name=turn.yourdomain.com

use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_TURN_SECRET

# Certificates from certbot (certbot certonly --standalone -d turn.yourdomain.com)
cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

min-port=49160
max-port=49200
fingerprint
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Never relay into private networks (stops the TURN server being used to reach internal hosts)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
user-quota=12
total-quota=1200
stale-nonce=600
log-file=/var/log/turnserver.log
simple-log
