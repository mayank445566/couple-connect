# /etc/nginx/sites-available/relay  (then: ln -s ../sites-available/relay /etc/nginx/sites-enabled/)
# Get a certificate first: certbot --nginx -d relay.yourdomain.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name relay.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/relay.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.yourdomain.com/privkey.pem;

    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Only the PHP API publishes; it signs every request with RELAY_SECRET.
    location = /publish { proxy_pass http://127.0.0.1:8090; client_max_body_size 16k; }
    location = /health  { proxy_pass http://127.0.0.1:8090; }
    location / { return 404; }
}

server {
    listen 80;
    server_name relay.yourdomain.com;
    return 301 https://$host$request_uri;
}
